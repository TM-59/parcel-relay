# Python is used only for the local check runner, the CLI smoke and the theory check under scripts/.
[project]
name = "parcel-relay-scripts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["defusedxml"]

[dependency-groups]
dev = ["ruff", "mypy", "types-defusedxml"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Only rules the tool itself declares incompatible, or that cannot hold here, are left out;
# no code is excluded.
ignore = [
  # D203 and D211 are mutually exclusive (Ruff warns); keep D211 (no blank line before a class docstring).
  "D203",
  # D212 and D213 are mutually exclusive (Ruff warns); keep D212 (summary on the first line).
  "D213",
  # Conflicts with `ruff format` (Ruff documents it as unsafe to combine with the formatter).
  "COM812",
  # S603 and S607 contradict each other for programs without a fixed location: S607 (kept) wants an
  # absolute path, which for `mix` and `git` can only be found at run time (shutil.which), and S603
  # flags every argument list that is not literal. Keep S607; leave out S603.
  "S603",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["scripts"]
